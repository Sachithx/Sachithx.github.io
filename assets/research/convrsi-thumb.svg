<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="Each agent's feature stack is refined by a convolution kernel, then messages are aggregated across agents by a graph convolution over the collaboration topology.">
  <style>
    .lbl { font: 600 10px Inter, system-ui, sans-serif; fill: #687681; letter-spacing: .04em; }
    .feat { font: 500 7.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3b4955; text-anchor: middle; }
    .cell { fill: #ffffff; stroke: #e2e6e8; stroke-width: 1; }
    .msg { fill: #fbf0e2; }
    .kern { fill: none; stroke: #0f6b5c; stroke-width: 2; rx: 3; animation: slide 4.5s ease-in-out infinite; }
    .edge { stroke: #9fb6b0; stroke-width: 1.5; fill: none; }
    .pulse { stroke: #0f6b5c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 60; animation: flow 2.2s linear infinite; }
    .node { fill: #e7f2ef; stroke: #0f6b5c; stroke-width: 1.5; }
    .ntext { font: 600 9px Inter, system-ui, sans-serif; fill: #0f6b5c; text-anchor: middle; }
    @keyframes slide { 0%, 10% { transform: translateY(0); } 45%, 55% { transform: translateY(48px); } 90%, 100% { transform: translateY(0); } }
    @keyframes flow { to { stroke-dashoffset: -66; } }
    @media (prefers-reduced-motion: reduce) { .kern, .pulse { animation: none; } }
  </style>
  <rect width="300" height="200" fill="#ffffff"/>
  <text x="14" y="20" class="lbl">INTRA-AGENT CONV</text>
  <text x="168" y="20" class="lbl">INTER-AGENT GCN</text>

  <!-- feature stack for one agent -->
  <g transform="translate(22 32)">
    <rect class="cell" x="0" y="0" width="96" height="24"/><text class="feat" x="48" y="15">task</text>
    <rect class="cell" x="0" y="26" width="96" height="24"/><text class="feat" x="48" y="41">role</text>
    <rect class="cell" x="0" y="52" width="96" height="24"/><text class="feat" x="48" y="67">system</text>
    <rect class="cell" x="0" y="78" width="96" height="24"/><text class="feat" x="48" y="93">experience</text>
    <rect class="cell msg" x="0" y="104" width="96" height="24"/><text class="feat" x="48" y="119">message</text>
    <rect class="kern" x="-5" y="-4" width="106" height="84" rx="3"/>
    <text class="feat" x="48" y="150" style="fill:#687681">→ local message uᵢ</text>
  </g>

  <path d="M128 100 L150 100" stroke="#9fb6b0" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9fb6b0"/></marker></defs>

  <!-- collaboration graph -->
  <g>
    <path class="edge" d="M196 62 L256 62 M196 62 L180 128 M256 62 L272 128 M180 128 L272 128 M196 62 L272 128 M256 62 L180 128"/>
    <path class="pulse" d="M196 62 L256 62 L272 128 L180 128 Z"/>
    <path class="pulse" d="M196 62 L272 128 M256 62 L180 128" style="animation-delay:-1.1s"/>
    <circle class="node" cx="196" cy="62" r="15"/><text class="ntext" x="196" y="65.5">A1</text>
    <circle class="node" cx="256" cy="62" r="15"/><text class="ntext" x="256" y="65.5">A2</text>
    <circle class="node" cx="180" cy="128" r="15"/><text class="ntext" x="180" y="131.5">A3</text>
    <circle class="node" cx="272" cy="128" r="15"/><text class="ntext" x="272" y="131.5">AN</text>
    <text class="feat" x="226" y="174" style="fill:#687681">parallel update, all agents</text>
  </g>
</svg>
